{% extends "base.html" %}

{% block title %}Register Account — Zero Trust Enterprise Portal{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 my-4">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card-enterprise p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary p-3 rounded-circle mb-3">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">Create Account</h3>
                <p class="text-secondary fs-7 mb-0">Assign Role-Based Access Control (RBAC)</p>
            </div>

            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label text-dark font-medium fs-7 mb-1">Username</label>
                    <input type="text" id="username" class="form-control form-control-enterprise" placeholder="Enter username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-dark font-medium fs-7 mb-1">Email Address</label>
                    <input type="email" id="email" class="form-control form-control-enterprise" placeholder="user@company.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-dark font-medium fs-7 mb-1">Assigned Role</label>
                    <select id="role" class="form-select form-control-enterprise">
                        {% for r in roles %}
                        <option value="{{ r.name }}">{{ r.name }} — {{ r.description }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-dark font-medium fs-7 mb-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" id="password" class="form-control form-control-enterprise border-start-0 border-end-0" placeholder="Create password" required>
                        <button type="button" class="btn btn-outline-secondary border-start-0 bg-light" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')">
                            <i class="bi bi-eye text-muted" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-enterprise-primary w-100 py-2.5">
                    <i class="bi bi-check-circle me-2"></i> Register User Account
                </button>
            </form>

            <div class="mt-4 pt-3 text-center border-top">
                <span class="text-secondary fs-7">Already registered?</span>
                <a href="{{ url_for('auth.login_page') }}" class="text-primary text-decoration-none fw-semibold fs-7 ms-1">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const role = document.getElementById('role').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, role, password })
        });
        
        const data = await response.json();
        if (response.ok) {
            NIDS.showToast("Account Created", "Registration successful. Please log in.", "success");
            setTimeout(() => { window.location.href = "/login"; }, 1000);
        } else {
            NIDS.showToast("Registration Error", data.error || "Failed to register account", "danger");
        }
    } catch (err) {
        NIDS.showToast("Network Error", "Server connection failed", "danger");
    }
});
</script>
{% endblock %}
