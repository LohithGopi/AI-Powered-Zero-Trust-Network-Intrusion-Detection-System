{% extends "base.html" %}

{% block title %}Reset Password — Zero Trust Enterprise Portal{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 my-4">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card-enterprise p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary p-3 rounded-circle mb-3">
                    <i class="bi bi-key-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">Reset Password</h3>
                <p class="text-secondary fs-7 mb-0">Specify username or email to set a new password</p>
            </div>

            <form id="forgot-password-form">
                <div class="mb-3">
                    <label class="form-label text-dark font-medium fs-7 mb-1">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" id="identifier" class="form-control form-control-enterprise border-start-0" placeholder="Username or email" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-dark font-medium fs-7 mb-1">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="new_password" class="form-control form-control-enterprise border-start-0 border-end-0" placeholder="Enter new password" required>
                        <button type="button" class="btn btn-outline-secondary border-start-0 bg-light" id="togglePasswordBtn" onclick="togglePasswordVisibility('new_password', 'togglePasswordIcon')">
                            <i class="bi bi-eye text-muted" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-enterprise-primary w-100 py-2.5">
                    <i class="bi bi-arrow-repeat me-2"></i> Reset Password
                </button>
            </form>

            <div class="mt-4 pt-3 text-center border-top">
                <span class="text-secondary fs-7">Remember your password?</span>
                <a href="{{ url_for('auth.login_page') }}" class="text-primary text-decoration-none fw-semibold fs-7 ms-1">Return to Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('identifier').value;
    const new_password = document.getElementById('new_password').value;

    try {
        const response = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, new_password })
        });
        
        const data = await response.json();
        if (response.ok) {
            NIDS.showToast("Success", data.message || "Password reset successful!", "success");
            setTimeout(() => { window.location.href = "/login"; }, 1200);
        } else {
            NIDS.showToast("Reset Failed", data.error || "Failed to reset password.", "danger");
        }
    } catch (err) {
        NIDS.showToast("Network Error", "Server connection failed", "danger");
    }
});
</script>
{% endblock %}
